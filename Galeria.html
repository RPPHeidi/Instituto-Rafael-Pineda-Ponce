<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Galería</title>
  <style>
    body {
      background-color: #001f3f; 
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .galeria {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 0 12px rgba(0,0,0,0.2);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }

.galeria img {
  width: 100%;
  height: 300px;
  object-fit: cover;
  border-radius: 10px;
  margin-bottom: 15px;
}

    .galeria img:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px #0056b3;
    }

    .galeria button {
      background-color: antiquewhite;
      border: 1px solid #0056b3;
      color: rgb(27, 46, 188);
      padding: 10px 20px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 5px 10px 16px;
      margin: 0 10px;
      transition: background-color 0.3s ease, transform 0.3s ease;
    }

    .galeria button:hover {
      background-color: #d1d1d1;
      transform: scale(1.2);
      border-color: #0056b3;
    }

   
      .btn-volver {
      display: block;
      width: fit-content;
      margin: 30px auto 0;
      background-color: #123c84;
      color: white;
      border: none;
      padding: 12px 25px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s ease;
    }

     .btn-volver:hover {
      background-color: #0a2b65;
      transform: scale(1.05);
    }
    .boton-llamativo:hover {
      background-color: #d1d1d1;
      transform: scale(1.2);
      border-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="galeria">
    <img id="imagen" src="colegio1.jpg" alt="Imagen" />
    <div>
      <button onclick="anterior()">◀</button>
      <button onclick="siguiente()">▶</button>
    </div>
   <a href="index.html" class="btn-volver">← Volver a la Página Principal</a>
  </div>

  <script>
    const imagenes = [
        "colegio1.jpg",
        "colegio2.jpg",
        "colegio3.jpg",
        "colegio4.jpg",
        "Logodelcole.jpg",
        "colegio6.jpg",
        "colegio7.jpg",
        "colegio8.jpg",
        "colegio9.jpg",
        "colegio10.jpg",
        "colegio11.jpg",
        "colegio12.jpg",
        "colegio13.jpg",
        "colegio14.jpg",
        "colegio15.jpg",

     
    ];
    let actual = 0;

    function mostrarImagen() {
      document.getElementById("imagen").src = imagenes[actual];
    }

    function siguiente() {
      actual = (actual + 1) % imagenes.length;
      mostrarImagen();
    }

    function anterior() {
      actual = (actual - 1 + imagenes.length) % imagenes.length;
      mostrarImagen();
    }
  </script>
</body>
</html>
